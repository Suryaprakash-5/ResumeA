{% extends "base.html" %}
{% block title %}Enter Details{% endblock %}
{% block content %}
<div class="glass-panel" style="max-width: 900px; text-align: left; padding: 2.5rem;">
    <h2 style="text-align: center; margin-bottom: 2rem; font-size: 2rem;">Let's build your resume!</h2>
    <form action="{{ url_for('form') }}" method="POST">
        
        <!-- Personal Info -->
        <div class="form-section">
            <h3><i class="fa-solid fa-user"></i> Personal Information</h3>
            <div class="grid grid-2">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="name" class="form-control" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="john@example.com" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" name="phone" class="form-control" placeholder="+1 234 567 890" required>
                </div>
                <div class="form-group">
                    <label>Location / Address</label>
                    <input type="text" name="address" class="form-control" placeholder="New York, USA">
                </div>
                <div class="form-group">
                    <label>LinkedIn (Optional)</label>
                    <input type="text" name="linkedin" class="form-control" placeholder="linkedin.com/in/johndoe">
                </div>
                <div class="form-group">
                    <label>GitHub (Optional)</label>
                    <input type="text" name="github" class="form-control" placeholder="github.com/johndoe">
                </div>
            </div>
        </div>

        <!-- Skills -->
        <div class="form-section">
            <h3>
                <span><i class="fa-solid fa-code"></i> Skills</span>
                <button type="button" class="add-btn" onclick="addSkill()"><i class="fa-solid fa-plus"></i> Add Skill</button>
            </h3>
            <div id="skills-list" class="grid grid-2">
                <div class="dynamic-item form-group">
                    <input type="text" name="skills[]" class="form-control" placeholder="E.g. Python, Leadership">
                    <button type="button" class="remove-btn" onclick="this.parentElement.remove()"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="dynamic-item form-group">
                    <input type="text" name="skills[]" class="form-control" placeholder="E.g. HTML/CSS">
                    <button type="button" class="remove-btn" onclick="this.parentElement.remove()"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>
        </div>

        <!-- Education -->
        <div class="form-section">
            <h3>
                <span><i class="fa-solid fa-graduation-cap"></i> Education</span>
                <button type="button" class="add-btn" onclick="addEducation()"><i class="fa-solid fa-plus"></i> Add Education</button>
            </h3>
            <div id="education-list">
                <div class="dynamic-group">
                    <div class="grid grid-2">
                        <div class="form-group">
                            <label>Degree / Qualification</label>
                            <input type="text" name="edu_degree[]" class="form-control" placeholder="B.Sc Computer Science">
                        </div>
                        <div class="form-group">
                            <label>Graduation Year</label>
                            <input type="text" name="edu_year[]" class="form-control" placeholder="2024">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Institution Name</label>
                        <input type="text" name="edu_school[]" class="form-control" placeholder="University of Technology">
                    </div>
                </div>
            </div>
        </div>

        <!-- Experience -->
        <div class="form-section">
            <h3>
                <span><i class="fa-solid fa-briefcase"></i> Experience</span>
                <button type="button" class="add-btn" onclick="addExperience()"><i class="fa-solid fa-plus"></i> Add Experience</button>
            </h3>
            <div id="experience-list">
                <div class="dynamic-group">
                    <div class="grid grid-2">
                        <div class="form-group">
                            <label>Job Title</label>
                            <input type="text" name="exp_title[]" class="form-control" placeholder="Software Engineer">
                        </div>
                        <div class="form-group">
                            <label>Duration / Year</label>
                            <input type="text" name="exp_year[]" class="form-control" placeholder="2022 - Present">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Company Name</label>
                        <input type="text" name="exp_company[]" class="form-control" placeholder="Tech Innovations Inc.">
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea name="exp_desc[]" class="form-control" rows="3" placeholder="Developed new features..."></textarea>
                    </div>
                </div>
            </div>
        </div>

        <!-- Projects -->
        <div class="form-section">
            <h3>
                <span><i class="fa-solid fa-rocket"></i> Projects</span>
                <button type="button" class="add-btn" onclick="addProject()"><i class="fa-solid fa-plus"></i> Add Project</button>
            </h3>
            <div id="project-list">
                <div class="dynamic-group">
                    <div class="form-group">
                        <label>Project Title</label>
                        <input type="text" name="proj_title[]" class="form-control" placeholder="E-commerce Website">
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea name="proj_desc[]" class="form-control" rows="3" placeholder="Description of the tech stack and output..."></textarea>
                    </div>
                </div>
            </div>
        </div>

        <div style="text-align: center; margin-top: 3rem;">
            <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; max-width: 400px; font-size: 1.2rem; padding: 1.2rem;">
                Choose Template <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>

    </form>
</div>
{% endblock %}
